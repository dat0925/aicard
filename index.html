<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>アイドルカードメーカー ✨</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Noto Sans JP','Hiragino Maru Gothic Pro',sans-serif;background:#0d0015}

    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
    @keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
    @keyframes holo{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
    @keyframes shimmer{0%{background-position:-200% center}100%{background-position:200% center}}
    @keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
    @keyframes cardGlow{
      0%,100%{box-shadow:0 0 30px rgba(255,80,180,.5),0 0 80px rgba(180,80,255,.3),inset 0 0 30px rgba(255,255,255,.03)}
      50%{box-shadow:0 0 60px rgba(255,80,180,.8),0 0 120px rgba(180,80,255,.5),inset 0 0 40px rgba(255,255,255,.05)}
    }
    @keyframes nameShimmer{
      0%{background-position:0% center}
      100%{background-position:200% center}
    }
    @keyframes starPop{
      0%{opacity:0;transform:scale(0) rotate(-20deg)}
      70%{transform:scale(1.15) rotate(5deg)}
      100%{opacity:1;transform:scale(1) rotate(0deg)}
    }

    .btn{
      background:linear-gradient(135deg,#ff4da6,#b04dff,#4da6ff);
      border:none;color:#fff;padding:15px 40px;border-radius:50px;
      font-size:17px;font-weight:700;cursor:pointer;letter-spacing:3px;
      transition:all .2s;box-shadow:0 4px 24px rgba(180,60,255,.5);
      font-family:inherit;
    }
    .btn:hover{transform:translateY(-3px);box-shadow:0 8px 40px rgba(180,60,255,.7)}
    .btn:active{transform:scale(.97)}
    .btn:disabled{opacity:.4;cursor:not-allowed;transform:none}

    .chip{
      display:inline-block;background:rgba(255,255,255,.1);border:1px solid rgba(255,180,255,.3);
      border-radius:20px;padding:6px 14px;font-size:13px;color:rgba(255,220,255,.9);
      cursor:pointer;transition:all .15s;margin:4px;font-family:inherit;
    }
    .chip:hover,.chip.selected{
      background:rgba(255,80,180,.3);border-color:rgba(255,100,200,.7);
      color:#fff;transform:scale(1.05);
    }

    .input-field{
      width:100%;padding:13px 18px;border-radius:16px;
      border:1.5px solid rgba(255,150,255,.3);
      background:rgba(255,255,255,.07);
      color:#fff;font-size:15px;outline:none;font-family:inherit;
      transition:border-color .2s;backdrop-filter:blur(10px);
    }
    .input-field::placeholder{color:rgba(255,200,255,.4)}
    .input-field:focus{border-color:rgba(255,100,200,.7)}

    .progress-star{color:rgba(255,200,100,.8);font-size:14px}
    .progress-star.done{color:#ffd700}

    @media print{
      body{background:#fff}
      .no-print{display:none!important}
      #idol-card{box-shadow:none!important;animation:none!important;border-radius:16px!important}
    }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useRef} = React;

const SUPABASE_URL = 'https://sfhtvtcmgueystyuhzvd.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNmaHR2dGNtZ3VleXN0eXVoenZkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ3Nzg0MDYsImV4cCI6MjA5MDM1NDQwNn0.qsON2xYdDf22LtU-jGd96Ubaif0xzzswC9KnzWndKNw';

const QUESTIONS = [
  {
    id:'color', emoji:'🎨', label:'好きな色は？',
    placeholder:'自由に入力してもOK！',
    chips:['ピンク','水色','むらさき','ゴールド','白','黒','赤','青','みどり','シルバー','オレンジ','黄色','ベージュ','ネイビー','ミント'],
  },
  {
    id:'food', emoji:'🍓', label:'好きな食べ物は？',
    placeholder:'自由に入力してもOK！',
    chips:['いちご','チョコ','プリン','ケーキ','アイス','クレープ','マカロン','たこやき','ラーメン','すし','ピザ','からあげ','ポテト','パンケーキ','わらびもち','タピオカ','メロン','ぶどう','かき氷','チーズ'],
  },
  {
    id:'skill', emoji:'⭐', label:'得意なことは？',
    placeholder:'自由に入力してもOK！',
    chips:['ダンス','歌','絵を描く','走るのが速い','料理','読書','ゲーム','おしゃべり','写真撮影','ピアノ','勉強','手芸','バク転','水泳','縄跳び','動画編集','ものまね','絵文字アート'],
  },
  {
    id:'personality', emoji:'🌸', label:'自分の性格に近いのは？', type:'select',
    chips:['みんなを笑わせるムードメーカー','クールでかっこいいタイプ','元気いっぱいパワフルタイプ','やさしくて癒し系タイプ','ミステリアスなタイプ'],
  },
  {
    id:'phrase', emoji:'💬', label:'好きな言葉・よく言うセリフは？',
    placeholder:'自由に入力してもOK！',
    chips:['なんとかなる！','ぜったいできる！','キラキラしてこ！','まかせて！','いっしょにがんばろ！','やってみなきゃわからない！','ありがとう！','たのしいが一番！','ドンマイ！','センスしかない'],
  },
  {
    id:'dream', emoji:'🌟', label:'将来なりたいものは？',
    placeholder:'自由に入力してもOK！',
    chips:['歌手','デザイナー','お医者さん','先生','ユーチューバー','声優','アニメーター','パティシエ','スポーツ選手','モデル','作家','保育士','宇宙飛行士','プログラマー','獣医さん','漫画家','ゲームクリエイター','カメラマン'],
  },
];

function App(){
  const [step,setStep]=useState('intro');
  const [qIdx,setQIdx]=useState(0);
  const [answers,setAnswers]=useState({});
  const [inputVal,setInputVal]=useState('');
  const [cardData,setCardData]=useState(null);
  const [err,setErr]=useState(null);

  const handleAnswer=(val)=>{
    if(!val.trim())return;
    const next={...answers,[QUESTIONS[qIdx].id]:val};
    setAnswers(next);
    if(qIdx<QUESTIONS.length-1){setQIdx(i=>i+1);setInputVal('');}
    else generateCard(next);
  };

  const generateCard=async(data)=>{
    setStep('loading');
    const prompt=`あなたはアイドルグループのスタープロデューサーです。以下の情報をもとに9〜11歳の女の子向けオリジナルアイドルキャラクターカードを作成してください。

情報:
- 好きな色: ${data.color}
- 好きな食べ物: ${data.food}
- 得意なこと: ${data.skill}
- 性格: ${data.personality}
- 好きな言葉: ${data.phrase}
- 将来の夢: ${data.dream}

以下のJSONのみで返答（前置き・後書き・コードブロック一切不要）:
{
  "idol_name": "芸名（漢字またはカタカナの2〜3文字、インパクト重視）",
  "idol_name_reading": "ふりがな（ひらがな）",
  "group_name": "所属グループ名（英語+日本語のかっこいい名前、例：STARBLOOM 星の扉）",
  "catchphrase": "キャッチフレーズ（15文字以内、語尾に！）",
  "special_move": "必殺パフォーマンス技の名前（かっこいい漢字+カタカナ、例：煌星ブレイズ）",
  "special_move_desc": "必殺技の説明（1文、かっこよく）",
  "profile": "プロフィール文（35字以内、魅力的に）",
  "card_number": "3桁の数字（例：047）",
  "star_power": 88から99の間の整数,
  "color_keyword": "好きな色に対応したCSS色コード（例：#ff69b4）"
}`;
    try{
      const res=await fetch(SUPABASE_URL+'/functions/v1/aicard-proxy',{
        method:'POST',
        headers:{'Content-Type':'application/json','Authorization':'Bearer '+SUPABASE_ANON_KEY},
        body:JSON.stringify({messages:[{role:'user',content:prompt}],max_tokens:1000})
      });
      const json=await res.json();
      const text=json.content.filter(i=>i.type==='text').map(i=>i.text).join('');
      setCardData(JSON.parse(text.replace(/```json|```/g,'').trim()));
      setStep('card');
    }catch(e){
      setErr('エラーが発生しました。もう一度試してみてね！');
      setStep('intro');
    }
  };

  const reset=()=>{setStep('intro');setQIdx(0);setAnswers({});setInputVal('');setCardData(null);setErr(null);};

  const bg={
    minHeight:'100vh',
    background:'linear-gradient(160deg,#0d0015 0%,#1a0030 40%,#0d0025 100%)',
    display:'flex',alignItems:'center',justifyContent:'center',
    padding:'24px',position:'relative',overflow:'hidden',
  };

  return(
    <div style={bg}>
      {/* BG stars */}
      {[...Array(12)].map((_,i)=>(
        <div key={i} style={{
          position:'fixed',width:`${2+Math.random()*3}px`,height:`${2+Math.random()*3}px`,
          borderRadius:'50%',background:'rgba(255,220,255,.6)',
          top:`${Math.random()*100}%`,left:`${Math.random()*100}%`,
          animation:`float ${3+i*.4}s ease-in-out infinite`,
          animationDelay:`${i*.5}s`,pointerEvents:'none',zIndex:0,
        }}/>
      ))}
      <div style={{position:'relative',zIndex:1,width:'100%',maxWidth:'440px'}}>
        {step==='intro'    &&<IntroScreen onStart={()=>setStep('questions')} err={err}/>}
        {step==='questions'&&<QuestionScreen q={QUESTIONS[qIdx]} idx={qIdx} total={QUESTIONS.length} val={inputVal} setVal={setInputVal} onAnswer={handleAnswer}/>}
        {step==='loading'  &&<LoadingScreen/>}
        {step==='card'     &&<CardScreen data={cardData} onReset={reset}/>}
      </div>
    </div>
  );
}

/* ── INTRO ── */
function IntroScreen({onStart,err}){
  return(
    <div style={{textAlign:'center',animation:'fadeUp .6s ease'}}>
      <div style={{fontSize:'72px',animation:'float 3s ease-in-out infinite',display:'inline-block',marginBottom:'8px'}}>🌟</div>
      <h1 style={{
        fontFamily:"'Dela Gothic One',sans-serif",
        fontSize:'30px',letterSpacing:'4px',margin:'0 0 8px',
        background:'linear-gradient(135deg,#ff80c0,#d080ff,#80c0ff)',
        WebkitBackgroundClip:'text',WebkitTextFillColor:'transparent',
        backgroundSize:'200% auto',animation:'nameShimmer 4s linear infinite',
      }}>アイドルカード<br/>メーカー</h1>
      <p style={{color:'rgba(255,200,255,.6)',fontSize:'13px',letterSpacing:'3px',marginBottom:'32px'}}>✦ あなただけのアイドルが生まれる ✦</p>
      {err&&<p style={{color:'#ff6090',fontSize:'13px',marginBottom:'16px'}}>{err}</p>}
      <div style={{
        background:'rgba(255,255,255,.05)',backdropFilter:'blur(20px)',
        borderRadius:'24px',padding:'22px 24px',marginBottom:'32px',
        border:'1px solid rgba(255,150,255,.2)',
      }}>
        <p style={{color:'rgba(255,220,255,.8)',fontSize:'14px',lineHeight:2}}>
          🎤 6つの質問に答えるだけで<br/>
          あなただけのアイドルカードが完成！<br/>
          友達に見せちゃおう 💕
        </p>
      </div>
      <button className="btn" onClick={onStart}>つくってみる →</button>
    </div>
  );
}

/* ── QUESTION ── */
function QuestionScreen({q,idx,total,val,setVal,onAnswer}){
  const handleChip=(opt)=>{
    if(q.type==='select') onAnswer(opt);
    else setVal(opt);
  };
  return(
    <div style={{animation:'fadeUp .35s ease'}}>
      {/* Progress */}
      <div style={{marginBottom:'20px'}}>
        <div style={{display:'flex',justifyContent:'space-between',marginBottom:'8px',alignItems:'center'}}>
          <span style={{color:'rgba(255,180,255,.7)',fontSize:'12px',fontWeight:'bold'}}>
            質問 {idx+1} / {total}
          </span>
          <span style={{fontSize:'14px',letterSpacing:'2px'}}>
            {[...Array(total)].map((_,i)=>(
              <span key={i} className={`progress-star${i<=idx?' done':''}`}>✦</span>
            ))}
          </span>
        </div>
        <div style={{background:'rgba(255,255,255,.1)',borderRadius:'4px',height:'4px'}}>
          <div style={{
            background:'linear-gradient(90deg,#ff4da6,#b04dff)',
            height:'100%',borderRadius:'4px',
            width:`${((idx+1)/total)*100}%`,transition:'width .4s ease',
          }}/>
        </div>
      </div>

      <div style={{
        background:'rgba(255,255,255,.05)',backdropFilter:'blur(20px)',
        borderRadius:'28px',padding:'28px 22px',
        border:'1px solid rgba(255,150,255,.2)',
      }}>
        <div style={{fontSize:'44px',textAlign:'center',marginBottom:'10px'}}>{q.emoji}</div>
        <h2 style={{
          fontSize:'18px',fontWeight:900,color:'rgba(255,220,255,.95)',
          textAlign:'center',marginBottom:'20px',letterSpacing:'1px',
        }}>{q.label}</h2>

        {/* Text input (not for select type) */}
        {q.type!=='select'&&(
          <>
            <input className="input-field" value={val} onChange={e=>setVal(e.target.value)}
              onKeyDown={e=>e.key==='Enter'&&val.trim()&&onAnswer(val)}
              placeholder={q.placeholder} autoFocus/>
            <button className="btn" onClick={()=>onAnswer(val)} disabled={!val.trim()}
              style={{marginTop:'16px',width:'100%',padding:'13px',fontSize:'15px'}}>
              つぎへ ✦
            </button>
            <div style={{marginTop:'18px',borderTop:'1px solid rgba(255,255,255,.1)',paddingTop:'16px'}}>
              <p style={{color:'rgba(255,180,255,.5)',fontSize:'11px',marginBottom:'10px',letterSpacing:'2px'}}>
                ▼ タップでかんたん入力
              </p>
              <div style={{display:'flex',flexWrap:'wrap',gap:'0'}}>
                {q.chips.map(c=>(
                  <span key={c} className={`chip${val===c?' selected':''}`} onClick={()=>handleChip(c)}>{c}</span>
                ))}
              </div>
            </div>
          </>
        )}

        {/* Select type (personality) */}
        {q.type==='select'&&(
          <div style={{display:'flex',flexDirection:'column',gap:'10px'}}>
            {q.chips.map(o=>(
              <button key={o} onClick={()=>handleChip(o)} style={{
                background:'rgba(255,255,255,.07)',border:'1.5px solid rgba(255,150,255,.25)',
                borderRadius:'16px',padding:'14px 18px',textAlign:'left',
                fontSize:'15px',cursor:'pointer',transition:'all .18s',
                fontFamily:'inherit',color:'rgba(255,220,255,.9)',
              }}
              onMouseEnter={e=>{e.target.style.background='rgba(255,80,160,.25)';e.target.style.borderColor='rgba(255,100,200,.6)';}}
              onMouseLeave={e=>{e.target.style.background='rgba(255,255,255,.07)';e.target.style.borderColor='rgba(255,150,255,.25)';}}
              >{o}</button>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

/* ── LOADING ── */
function LoadingScreen(){
  const msgs=['✦ アイドルを召喚中…','✦ 才能を解析中…','✦ 必殺技を考案中…','✦ カードを仕上げ中…'];
  const [i,setI]=useState(0);
  useEffect(()=>{const t=setInterval(()=>setI(n=>(n+1)%msgs.length),1100);return()=>clearInterval(t);},[]);
  return(
    <div style={{textAlign:'center',animation:'fadeUp .4s ease'}}>
      <div style={{fontSize:'64px',display:'inline-block',animation:'spin 2s linear infinite'}}>✦</div>
      <p style={{color:'rgba(255,180,255,.9)',fontSize:'18px',fontWeight:'bold',marginTop:'20px',letterSpacing:'3px'}}>{msgs[i]}</p>
      <p style={{color:'rgba(255,150,255,.5)',fontSize:'13px',marginTop:'8px'}}>しばらくまってね…</p>
    </div>
  );
}

/* ── CARD ── */
function CardScreen({data,onReset}){
  if(!data)return null;
  const sp=data.star_power||95;
  const accent=data.color_keyword||'#ff4da6';

  return(
    <div style={{animation:'fadeUp .6s ease'}}>
      <p className="no-print" style={{
        textAlign:'center',fontWeight:900,fontSize:'18px',marginBottom:'20px',
        letterSpacing:'2px',
        background:'linear-gradient(135deg,#ff80c0,#d080ff)',
        WebkitBackgroundClip:'text',WebkitTextFillColor:'transparent',
      }}>🎉 カードができたよ！</p>

      {/* ═══ THE CARD ═══ */}
      <div id="idol-card" style={{
        background:'linear-gradient(160deg,#1a0030 0%,#0d0020 50%,#1a0035 100%)',
        borderRadius:'20px',overflow:'hidden',
        border:`1.5px solid ${accent}55`,
        animation:'cardGlow 3s ease-in-out infinite',
        marginBottom:'20px',
        position:'relative',
      }}>
        {/* Holo sheen */}
        <div style={{
          position:'absolute',inset:0,zIndex:1,pointerEvents:'none',
          background:'linear-gradient(115deg,rgba(255,255,255,0) 0%,rgba(255,255,255,.04) 40%,rgba(255,200,255,.06) 50%,rgba(255,255,255,.04) 60%,rgba(255,255,255,0) 100%)',
          backgroundSize:'200% 200%',animation:'holo 6s ease infinite',borderRadius:'20px',
        }}/>

        {/* Accent bar top */}
        <div style={{
          height:'4px',
          background:`linear-gradient(90deg,transparent,${accent},#d080ff,${accent},transparent)`,
          backgroundSize:'200% 100%',animation:'shimmer 3s linear infinite',
        }}/>

        <div style={{position:'relative',zIndex:2,padding:'22px 20px 20px'}}>
          {/* Header row */}
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'24px'}}>
            <span style={{
              fontFamily:"'Dela Gothic One',sans-serif",
              fontSize:'10px',letterSpacing:'3px',color:`${accent}cc`,
            }}>IDOL CARD</span>
            <span style={{fontSize:'11px',color:'rgba(255,200,255,.4)',letterSpacing:'2px',fontFamily:"'Dela Gothic One',sans-serif"}}>
              No.{data.card_number||'001'}
            </span>
          </div>

          {/* Name block */}
          <div style={{textAlign:'center',marginBottom:'20px'}}>
            <p style={{fontSize:'11px',color:'rgba(255,200,255,.5)',letterSpacing:'4px',marginBottom:'6px'}}>{data.idol_name_reading}</p>
            <h1 style={{
              fontFamily:"'Dela Gothic One',sans-serif",
              fontSize:'58px',lineHeight:1,letterSpacing:'6px',
              background:`linear-gradient(135deg,#fff 0%,${accent} 40%,#fff 60%,${accent} 100%)`,
              WebkitBackgroundClip:'text',WebkitTextFillColor:'transparent',
              backgroundSize:'200% auto',animation:'nameShimmer 4s linear infinite',
              textShadow:'none',
            }}>{data.idol_name}</h1>
          </div>

          {/* Group name */}
          <p style={{
            textAlign:'center',fontSize:'11px',letterSpacing:'3px',
            color:'rgba(255,200,255,.6)',marginBottom:'20px',fontWeight:'bold',
          }}>{data.group_name}</p>

          {/* Catchphrase */}
          <div style={{
            textAlign:'center',
            border:`1px solid ${accent}44`,
            borderRadius:'10px',padding:'10px 16px',marginBottom:'20px',
            background:`${accent}11`,
          }}>
            <p style={{fontSize:'15px',fontWeight:'bold',color:'#fff',letterSpacing:'1px'}}>
              「{data.catchphrase}」
            </p>
          </div>

          {/* Star Power */}
          <div style={{marginBottom:'20px'}}>
            <div style={{display:'flex',justifyContent:'space-between',marginBottom:'6px'}}>
              <span style={{fontSize:'10px',color:'rgba(255,200,100,.8)',letterSpacing:'3px',fontWeight:'bold'}}>✦ STAR POWER</span>
              <span style={{
                fontFamily:"'Dela Gothic One',sans-serif",
                fontSize:'18px',color:accent,letterSpacing:'2px',
              }}>{sp}</span>
            </div>
            <div style={{background:'rgba(255,255,255,.08)',borderRadius:'4px',height:'6px',overflow:'hidden'}}>
              <div style={{
                background:`linear-gradient(90deg,${accent},#d080ff,#80c0ff)`,
                height:'100%',borderRadius:'4px',width:`${sp}%`,
                backgroundSize:'200% 100%',animation:'shimmer 2s linear infinite',
              }}/>
            </div>
          </div>

          {/* Divider */}
          <div style={{height:'1px',background:`linear-gradient(90deg,transparent,${accent}44,transparent)`,marginBottom:'20px'}}/>

          {/* Special Move */}
          <div style={{marginBottom:'16px'}}>
            <p style={{fontSize:'10px',color:'rgba(255,200,100,.7)',letterSpacing:'3px',marginBottom:'6px',fontWeight:'bold'}}>
              💥 必殺パフォーマンス
            </p>
            <p style={{
              fontFamily:"'Dela Gothic One',sans-serif",
              fontSize:'20px',letterSpacing:'2px',
              background:`linear-gradient(90deg,#fff,${accent})`,
              WebkitBackgroundClip:'text',WebkitTextFillColor:'transparent',
              marginBottom:'4px',
            }}>{data.special_move}</p>
            <p style={{fontSize:'12px',color:'rgba(255,200,255,.6)',lineHeight:1.6}}>{data.special_move_desc}</p>
          </div>

          {/* Profile */}
          <p style={{
            fontSize:'12px',color:'rgba(255,200,255,.55)',
            lineHeight:1.8,textAlign:'center',
            borderTop:'1px solid rgba(255,255,255,.08)',paddingTop:'16px',
          }}>{data.profile}</p>
        </div>

        {/* Accent bar bottom */}
        <div style={{
          height:'4px',
          background:`linear-gradient(90deg,transparent,${accent},#d080ff,${accent},transparent)`,
          backgroundSize:'200% 100%',animation:'shimmer 3s linear infinite',
        }}/>
      </div>

      {/* Buttons */}
      <div className="no-print" style={{display:'flex',gap:'10px'}}>
        <button className="btn" onClick={()=>window.print()} style={{flex:1,padding:'13px',fontSize:'15px'}}>
          🖨️ 印刷する
        </button>
        <button onClick={onReset} style={{
          flex:1,background:'rgba(255,255,255,.07)',
          border:'1.5px solid rgba(255,150,255,.3)',
          borderRadius:'50px',padding:'13px',fontSize:'15px',
          color:'rgba(255,200,255,.8)',cursor:'pointer',fontWeight:'bold',
          fontFamily:'inherit',transition:'all .2s',
        }}>もう一度 ✦</button>
      </div>
    </div>
  );
}

const root=ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
</html>
